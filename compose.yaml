name: ${COMPOSE_PROJECT_NAME:-dc-saas}

x-java-service-base: &java-service-base
  network_mode: host
  restart: unless-stopped
  init: true
  user: "${RUNTIME_UID:-0}:${RUNTIME_GID:-0}"
  stop_grace_period: 30s
  environment:
    TZ: Asia/Shanghai
    DEPLOY_ROOT: /srv/dc
  volumes:
    - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
    - ${DEPLOY_ROOT}/data:/srv/dc/data
    - ${DEPLOY_ROOT}/log:/srv/dc/log

services:
  mysql:
    image: ${MYSQL_IMAGE_REPOSITORY:-docker.m.daocloud.io/library/mysql}:${MYSQL_IMAGE_TAG:-8.0.36}
    container_name: dc-saas-mysql
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_TCP_PORT: ${MYSQL_PORT:-33306}
      MYSQL_DATABASE: dc
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --port=${MYSQL_PORT:-33306}
      - --bind-address=127.0.0.1
      - --innodb-buffer-pool-size=512M
      - --max-connections=300
    volumes:
      - ${DEPLOY_ROOT}/data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P\"$${MYSQL_TCP_PORT}\" -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1536m}
    cpus: ${MYSQL_CPU_LIMIT:-0.50}

  clickhouse:
    image: ${CLICKHOUSE_IMAGE_REPOSITORY:-docker.m.daocloud.io/clickhouse/clickhouse-server}:${CLICKHOUSE_IMAGE_TAG:-25.9.3.48}
    container_name: dc-saas-clickhouse
    network_mode: host
    restart: unless-stopped
    security_opt:
      - systempaths=unconfined
    environment:
      TZ: Asia/Shanghai
      SAAS_CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-39000}
      CLICKHOUSE_DB: dc
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_RUN_AS_ROOT: "1"
    volumes:
      - ${DEPLOY_ROOT}/data/clickhouse:/var/lib/clickhouse
      - ${DEPLOY_ROOT}/log/clickhouse:/var/log/clickhouse-server
      - ./clickhouse/saas-init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d/20-saas-memory.xml:/etc/clickhouse-server/users.d/20-saas-memory.xml:ro
      - ${DEPLOY_ROOT}/control/clickhouse-ports.xml:/etc/clickhouse-server/config.d/10-saas-ports.xml:ro
      - ${DEPLOY_ROOT}/control/clickhouse-client.xml:/etc/clickhouse-client/config.xml:ro
      - ${DEPLOY_ROOT}/control/clickhouse-docker-related.xml:/etc/clickhouse-server/config.d/docker_related_config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --port \"$${SAAS_CLICKHOUSE_NATIVE_PORT}\" --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:-2048m}
    cpus: ${CLICKHOUSE_CPU_LIMIT:-0.75}

  zookeeper:
    image: ${ZOOKEEPER_IMAGE_REPOSITORY:-docker.m.daocloud.io/library/zookeeper}:${ZOOKEEPER_TAG:-3.8.4}
    container_name: dc-saas-zookeeper
    network_mode: host
    restart: unless-stopped
    # The 97.64 host runs an old 3.10 kernel. Docker 26/runc otherwise rejects
    # the default /sys/fs/cgroup mount while creating this image's container.
    security_opt:
      - systempaths=unconfined
    environment:
      TZ: Asia/Shanghai
      # Java services also use host networking. Bind ZooKeeper directly to the
      # isolated SaaS port to avoid the legacy kernel's docker-proxy resets.
      ZOO_SERVERS: server.1=localhost:32888:33888
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr,mntr
      ZOO_ADMINSERVER_ENABLED: "false"
      ZOO_CFG_EXTRA: authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider requireClientAuthScheme=sasl clientPort=${ZOOKEEPER_PORT:-32181} clientPortAddress=127.0.0.1
      SERVER_JVMFLAGS: -Djava.security.auth.login.config=/conf/jaas.ini
    volumes:
      - ${DEPLOY_ROOT}/data/zookeeper:/data
      - ${DEPLOY_ROOT}/log/zookeeper:/datalog
      - ${DEPLOY_ROOT}/control/zookeeper-jaas.ini:/conf/jaas.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: ${ZOOKEEPER_MEMORY_LIMIT:-384m}
    cpus: ${ZOOKEEPER_CPU_LIMIT:-0.10}

  gateway:
    <<: *java-service-base
    image: ${GW_IMAGE_REPOSITORY:-ghcr.io/bliplink/gw}:${GW_TAG:-saas-crypto}
    container_name: dc-saas-gateway
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: GW
      MAIN_CLASS: GW
      JAVA_OPTS: ${GW_JAVA_OPTS:--server -Xms64m -Xmx256m -Xmn64m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/GW/config/spring-tcp-server.xml:/srv/dc/dc/GW/config/spring-tcp-server.xml:ro
      - ${DEPLOY_ROOT}/control/overrides/GW/config/spring-gw-client.xml:/srv/dc/dc/GW/config/spring-gw-client.xml:ro
    mem_limit: ${GW_MEMORY_LIMIT:-384m}
    cpus: ${GW_CPU_LIMIT:-0.35}

  loginsvr:
    <<: *java-service-base
    image: ${LOGINSVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/loginsvr}:${LOGINSVR_TAG:-saas-crypto}
    container_name: dc-saas-loginsvr
    depends_on:
      mysql:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: LoginSvr
      MAIN_CLASS: LoginSvr
      JAVA_OPTS: ${LOGINSVR_JAVA_OPTS:--server -Xms64m -Xmx256m -Xmn64m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/LoginSvr/config/application.properties:/srv/dc/dc/LoginSvr/config/application.properties:ro
    mem_limit: ${LOGINSVR_MEMORY_LIMIT:-384m}
    cpus: ${LOGINSVR_CPU_LIMIT:-0.15}

  mdsvr:
    <<: *java-service-base
    image: ${MDSVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/mdsvr}:${MDSVR_TAG:-saas-crypto}
    container_name: dc-saas-mdsvr
    depends_on:
      clickhouse:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: MDSvr
      MAIN_CLASS: MDSvr
      JAVA_OPTS: ${MDSVR_JAVA_OPTS:--server -Xms64m -Xmx448m -Xmn112m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/MDSvr/config/application.properties:/srv/dc/dc/MDSvr/config/application.properties:ro
    mem_limit: ${MDSVR_MEMORY_LIMIT:-640m}
    cpus: ${MDSVR_CPU_LIMIT:-0.35}

  apssvr:
    <<: *java-service-base
    image: ${APSSVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/apssvr}:${APSSVR_TAG:-saas-crypto}
    container_name: dc-saas-apssvr
    depends_on:
      mysql:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: APSSvr
      MAIN_CLASS: APSSvr
      JAVA_OPTS: ${APSSVR_JAVA_OPTS:--server -Xms64m -Xmx448m -Xmn112m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/log:/srv/dc/logs
      - ${DEPLOY_ROOT}/control/overrides/APSSvr/config/application.properties:/srv/dc/dc/APSSvr/config/application.properties:ro
    mem_limit: ${APSSVR_MEMORY_LIMIT:-640m}
    cpus: ${APSSVR_CPU_LIMIT:-0.35}

  ordersvr:
    <<: *java-service-base
    image: ${ORDERSVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/ordersvr}:${ORDERSVR_TAG:-saas-crypto}
    container_name: dc-saas-ordersvr
    depends_on:
      mysql:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: OrderSvr
      MAIN_CLASS: OrderSvr
      JAVA_OPTS: ${ORDERSVR_JAVA_OPTS:--server -Xms64m -Xmx448m -Xmn112m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/OrderSvr/config/application.properties:/srv/dc/dc/OrderSvr/config/application.properties:ro
    mem_limit: ${ORDERSVR_MEMORY_LIMIT:-640m}
    cpus: ${ORDERSVR_CPU_LIMIT:-0.50}

  tradesvr:
    <<: *java-service-base
    image: ${TRADESVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/tradesvr}:${TRADESVR_TAG:-saas-crypto}
    container_name: dc-saas-tradesvr
    depends_on:
      mysql:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: TradeSvr
      MAIN_CLASS: TradeSvr
      JAVA_OPTS: ${TRADESVR_JAVA_OPTS:--server -Xms64m -Xmx384m -Xmn96m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/TradeSvr/config/application.properties:/srv/dc/dc/TradeSvr/config/application.properties:ro
    mem_limit: ${TRADESVR_MEMORY_LIMIT:-640m}
    cpus: ${TRADESVR_CPU_LIMIT:-0.50}

  liqsvr:
    <<: *java-service-base
    image: ${LIQSVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/liqsvr}:${LIQSVR_TAG:-saas-crypto}
    container_name: dc-saas-liqsvr
    depends_on:
      mysql:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: LiqSvr
      MAIN_CLASS: LiqSvr
      JAVA_OPTS: ${LIQSVR_JAVA_OPTS:--server -Xms64m -Xmx256m -Xmn64m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/LiqSvr/config/application.properties:/srv/dc/dc/LiqSvr/config/application.properties:ro
    mem_limit: ${LIQSVR_MEMORY_LIMIT:-384m}
    cpus: ${LIQSVR_CPU_LIMIT:-0.15}

  managersvr:
    <<: *java-service-base
    image: ${MANAGERSVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/managersvr}:${MANAGERSVR_TAG:-saas-crypto}
    container_name: dc-saas-managersvr
    depends_on:
      mysql:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: ManagerSvr
      MAIN_CLASS: ManagerSvr
      JAVA_OPTS: ${MANAGERSVR_JAVA_OPTS:--server -Xms64m -Xmx256m -Xmn64m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/ManagerSvr/config/application.properties:/srv/dc/dc/ManagerSvr/config/application.properties:ro
    mem_limit: ${MANAGERSVR_MEMORY_LIMIT:-384m}
    cpus: ${MANAGERSVR_CPU_LIMIT:-0.15}

  adminsvr:
    <<: *java-service-base
    image: ${ADMINSVR_IMAGE_REPOSITORY:-ghcr.io/bliplink/adminsvr}:${ADMINSVR_TAG:-saas-crypto}
    container_name: dc-saas-adminsvr
    depends_on:
      mysql:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: AdminSvr
      MAIN_CLASS: AdminSvr
      JAVA_OPTS: ${ADMINSVR_JAVA_OPTS:--server -Xms64m -Xmx256m -Xmn64m -Djava.security.auth.login.config=../../control/jaas.ini}
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/control/overrides/AdminSvr/config/application.properties:/srv/dc/dc/AdminSvr/config/application.properties:ro
    mem_limit: ${ADMINSVR_MEMORY_LIMIT:-384m}
    cpus: ${ADMINSVR_CPU_LIMIT:-0.15}

  web:
    image: ${TRADE_WEB_IMAGE_REPOSITORY:-ghcr.io/bliplink/dc-saas-trade-web}:${TRADE_WEB_TAG:-saas-crypto}
    container_name: dc-saas-trade-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      WEB_LISTEN_PORT: ${WEB_LISTEN_PORT:-18088}
      GATEWAY_HOST: 127.0.0.1
      GATEWAY_HTTP_PORT: ${GW_HTTP_PORT:-33002}
      GATEWAY_WS_PORT: ${GW_WEBSOCKET_PORT:-33001}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${WEB_LISTEN_PORT}/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: ${TRADE_WEB_MEMORY_LIMIT:-256m}
    cpus: ${TRADE_WEB_CPU_LIMIT:-0.10}
