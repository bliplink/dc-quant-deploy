name: ${COMPOSE_PROJECT_NAME}

x-java-service-base: &java-service-base
  network_mode: host
  restart: unless-stopped
  user: "${RUNTIME_UID}:${RUNTIME_GID}"
  environment:
    TZ: Asia/Shanghai
    DEPLOY_ROOT: /srv/dc
  volumes:
    - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
    - ${DEPLOY_ROOT}/data:/srv/dc/data
    - ${DEPLOY_ROOT}/log:/srv/dc/log

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG}
    container_name: dc-clickhouse
    profiles: ["embedded-clickhouse"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CLICKHOUSE_DB: ${CLICKHOUSE_DB_NAME}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_RUN_AS_ROOT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - ${DEPLOY_ROOT}/data/clickhouse:/var/lib/clickhouse
      - ${DEPLOY_ROOT}/log/clickhouse:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  zookeeper:
    image: ghcr.io/bliplink/zookeeper:${ZOOKEEPER_TAG}
    container_name: dc-zookeeper
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ATS_ROOT: /opt/zookeeper/runtime
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_DATA_DIR: /opt/zookeeper/data
      ZOOKEEPER_JMX_PORT: 8888
    volumes:
      - ${DEPLOY_ROOT}/data/zookeeper:/opt/zookeeper/data
      - ${DEPLOY_ROOT}/log:/opt/zookeeper/runtime/log

  gateway:
    <<: *java-service-base
    image: ghcr.io/bliplink/gw:${GW_TAG}
    container_name: dc-gateway
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/data/java-prefs/GW:/srv/dc/.java
      - ${DEPLOY_ROOT}/data:/srv/dc/dc/GW/data
      - ${DEPLOY_ROOT}/log:/srv/dc/dc/GW/log
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: GW
      MAIN_CLASS: GW
      JAVA_OPTS: -server -Xmx2048m -Xms2048m -Xmn512m -Djava.security.auth.login.config=../../control/jaas.ini

  mdsvr:
    <<: *java-service-base
    image: ghcr.io/bliplink/mdsvr:${MDSVR_TAG}
    container_name: dc-mdsvr
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/data/java-prefs/MDSvr:/srv/dc/.java
      - ${DEPLOY_ROOT}/data:/srv/dc/dc/MDSvr/data
      - ${DEPLOY_ROOT}/log:/srv/dc/dc/MDSvr/log
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: MDSvr
      MAIN_CLASS: MDSvr
      JAVA_OPTS: -server -Xmx2048m -Xms2048m -Xmn512m -Djava.security.auth.login.config=../../control/jaas.ini

  apssvr:
    <<: *java-service-base
    image: ghcr.io/bliplink/apssvr:${APSSVR_TAG}
    container_name: dc-apssvr
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/log:/srv/dc/logs
      - ${DEPLOY_ROOT}/data/java-prefs/APSSvr:/srv/dc/.java
      - ${DEPLOY_ROOT}/data:/srv/dc/dc/APSSvr/data
      - ${DEPLOY_ROOT}/log:/srv/dc/dc/APSSvr/log
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: APSSvr
      MAIN_CLASS: APSSvr
      JAVA_OPTS: -server -Xmx2048m -Xms2048m -Xmn512m -Djava.security.auth.login.config=../../control/jaas.ini

  quantsvr:
    <<: *java-service-base
    image: ghcr.io/bliplink/quantsvr:${QUANTSVR_TAG}
    container_name: dc-quantsvr
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/data/java-prefs/QuantSvr:/srv/dc/.java
      - ${DEPLOY_ROOT}/data:/srv/dc/dc/QuantSvr/data
      - ${DEPLOY_ROOT}/log:/srv/dc/dc/QuantSvr/log
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: QuantSvr
      MAIN_CLASS: QuantSvr
      JAVA_OPTS: -server -Xmx2048m -Xms2048m -Xmn512m -Djava.security.auth.login.config=../../control/jaas.ini

  indsvr:
    <<: *java-service-base
    image: ghcr.io/bliplink/indsvr:${INDSVR_TAG}
    container_name: dc-indsvr
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/data/java-prefs/INDSvr:/srv/dc/.java
      - ${DEPLOY_ROOT}/data:/srv/dc/dc/INDSvr/data
      - ${DEPLOY_ROOT}/log:/srv/dc/dc/INDSvr/log
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: INDSvr
      MAIN_CLASS: INDSvr
      JAVA_OPTS: -server -Xmx2048m -Xms2048m -Xmn512m -Djava.security.auth.login.config=../../control/jaas.ini

  simsvr:
    <<: *java-service-base
    image: ghcr.io/skt-walter/simsvr:${SIMSVR_TAG}
    container_name: dc-simsvr
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/data/java-prefs/SIMSvr:/srv/dc/.java
      - ${DEPLOY_ROOT}/data:/srv/dc/dc/SIMSvr/data
      - ${DEPLOY_ROOT}/log:/srv/dc/dc/SIMSvr/log
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: SIMSvr
      MAIN_CLASS: SIMSvr
      JAVA_OPTS: -server -Xmx2048m -Xms2048m -Xmn512m -Djava.security.auth.login.config=../../control/jaas.ini

  batchsvr:
    <<: *java-service-base
    image: ghcr.io/bliplink/batchsvr:${BATCHSVR_TAG}
    container_name: dc-batchsvr
    volumes:
      - ${DEPLOY_ROOT}/control:/srv/dc/control:ro
      - ${DEPLOY_ROOT}/data:/srv/dc/data
      - ${DEPLOY_ROOT}/log:/srv/dc/log
      - ${DEPLOY_ROOT}/data/java-prefs/BatchSvr:/srv/dc/.java
      - ${DEPLOY_ROOT}/data:/srv/dc/dc/BatchSvr/data
      - ${DEPLOY_ROOT}/log:/srv/dc/dc/BatchSvr/log
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      DEPLOY_ROOT: /srv/dc
      SERVICE_NAME: BatchSvr
      MAIN_CLASS: BatchSvr
      JAVA_OPTS: -server -Xmx5048m -Xms5048m -Xmn512m -Djava.security.auth.login.config=../../control/jaas.ini

  web:
    image: ghcr.io/skt-walter/web:${WEB_TAG}
    container_name: dc-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
