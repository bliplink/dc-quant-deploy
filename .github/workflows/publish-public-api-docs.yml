name: Publish and deploy bilingual public API docs

on:
  push:
    branches: [saas-crypto]
    paths:
      - docs/public-api/**
      - docs/openapi/**
      - docs/api/**
      - docs/DC_OPEN_API_V1_REFERENCE.zh-CN.md
      - docs/CRYPTO_OPEN_API_V1.zh-CN.md
      - mkdocs.public*.yml
      - requirements-docs.txt
      - scripts/*public-api*
      - scripts/validate-openapi-catalog.py
      - .github/workflows/publish-public-api-docs.yml
  workflow_dispatch:

concurrency:
  group: public-api-docs-saas-crypto
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bliplink/opentradingcore-api-docs

jobs:
  publish:
    if: github.ref == 'refs/heads/saas-crypto'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check bilingual edits
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF^{commit}"; then
            python3 scripts/check-public-api-docs-i18n.py --base-ref "$BASE_REF"
          else
            python3 scripts/check-public-api-docs-i18n.py
          fi
      - name: Prepare allowlisted Docker context
        id: context
        run: |
          CONTEXT_DIR="$(mktemp -d "${RUNNER_TEMP}/otc-api-docs.XXXXXX")"
          scripts/prepare-public-api-docs-context.sh "$CONTEXT_DIR"
          echo "path=$CONTEXT_DIR" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.path }}
          file: ./docs/public-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/bliplink/dc-quant-deploy
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PYTHON_IMAGE=python:3.12-slim
            NGINX_IMAGE=nginx:1.27-alpine

  deploy:
    needs: publish
    runs-on: [self-hosted, macOS, ARM64, otc-api-docs]
    environment: local-api-docs
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull verified image digest
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker pull "${IMAGE}@${IMAGE_DIGEST}"
      - name: Switch local docs container with rollback on failure
        env:
          PUBLIC_API_DOCS_TAG: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: scripts/deploy-public-api-docs-host.sh
      - name: Verify public hostname
        run: |
          curl --fail --silent --show-error --location --max-time 15 https://api.opentradingcore.com/en/ >/dev/null
          curl --fail --silent --show-error --location --max-time 15 https://api.opentradingcore.com/zh/ >/dev/null
