name: Validate cluster deployment configuration

on:
  workflow_dispatch:
  push:
    branches: [saas-crypto]
    paths:
      - .github/workflows/validate-cluster-config.yml
      - .env.example
      - compose.yaml
      - deploy-saas.sh
      - generate-saas-configs.sh
      - validate-saas.sh
      - control.prod/placement/**
      - tests/test-md-cluster-config.sh
      - tests/test-order-cluster-c-config.sh
      - tests/test_verify_placement_catalogs.py
      - tests/verify_placement_catalogs.py
  pull_request:
    paths:
      - .github/workflows/validate-cluster-config.yml
      - .env.example
      - compose.yaml
      - deploy-saas.sh
      - generate-saas-configs.sh
      - validate-saas.sh
      - control.prod/placement/**
      - tests/test-md-cluster-config.sh
      - tests/test-order-cluster-c-config.sh
      - tests/test_verify_placement_catalogs.py
      - tests/verify_placement_catalogs.py

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n deploy-saas.sh generate-saas-configs.sh validate-saas.sh tests/test-md-cluster-config.sh tests/test-order-cluster-c-config.sh
      - name: Validate generated cluster configurations
        run: |
          tests/test-md-cluster-config.sh
          tests/test-order-cluster-c-config.sh
      - name: Validate placement catalogs
        run: python -m unittest tests.test_verify_placement_catalogs
