name: Validate cluster deployment configuration

on:
  workflow_dispatch:
  push:
    branches: [saas-crypto]
    paths:
      - .github/workflows/validate-cluster-config.yml
      - .env.example
      - compose.yaml
      - auto-update-saas.sh
      - tests/test-auto-update-saas.sh
      - build-saas-images.sh
      - install-saas.sh
      - deploy-saas.sh
      - generate-saas-configs.sh
      - validate-saas.sh
      - control.prod/placement/**
      - tests/test-md-cluster-config.sh
      - tests/md_cluster_assignment_plan.py
      - tests/test_md_cluster_assignment_plan.py
      - tests/md_cluster_transition_host.py
      - tests/test_md_cluster_transition_host.py
      - tests/md_cluster_roll_drain_host.py
      - tests/test_md_cluster_roll_drain_host.py
      - tests/test-order-cluster-c-config.sh
      - tests/test-trade-cluster-config.sh
      - tests/trade_cluster_transition_host.py
      - tests/test_trade_cluster_transition_host.py
      - tests/run-trade-cluster-role-reversal-host.sh
      - tests/restart-order-trade-e2e.sh
      - tests/run-core-trading-acceptance.sh
      - tests/trade_cluster_assignments.py
      - tests/test_trade_cluster_assignments.py
      - tests/trade_cluster_bootstrap_host.py
      - tests/trade_cluster_bootstrap_host.py
      - tests/order-routing-key.sh
      - tests/test-placement-routing-key.sh
      - tests/test_verify_placement_catalogs.py
      - tests/verify_placement_catalogs.py
  pull_request:
    paths:
      - .github/workflows/validate-cluster-config.yml
      - .env.example
      - compose.yaml
      - auto-update-saas.sh
      - tests/test-auto-update-saas.sh
      - build-saas-images.sh
      - install-saas.sh
      - deploy-saas.sh
      - generate-saas-configs.sh
      - validate-saas.sh
      - control.prod/placement/**
      - tests/test-md-cluster-config.sh
      - tests/md_cluster_assignment_plan.py
      - tests/test_md_cluster_assignment_plan.py
      - tests/md_cluster_transition_host.py
      - tests/test_md_cluster_transition_host.py
      - tests/md_cluster_roll_drain_host.py
      - tests/test_md_cluster_roll_drain_host.py
      - tests/test-order-cluster-c-config.sh
      - tests/test-trade-cluster-config.sh
      - tests/trade_cluster_transition_host.py
      - tests/test_trade_cluster_transition_host.py
      - tests/run-trade-cluster-role-reversal-host.sh
      - tests/restart-order-trade-e2e.sh
      - tests/run-core-trading-acceptance.sh
      - tests/trade_cluster_assignments.py
      - tests/test_trade_cluster_assignments.py
      - tests/order-routing-key.sh
      - tests/test-placement-routing-key.sh
      - tests/test_verify_placement_catalogs.py
      - tests/verify_placement_catalogs.py

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n auto-update-saas.sh build-saas-images.sh install-saas.sh deploy-saas.sh generate-saas-configs.sh validate-saas.sh tests/test-auto-update-saas.sh tests/test-md-cluster-config.sh tests/test-order-cluster-c-config.sh tests/test-trade-cluster-config.sh tests/order-routing-key.sh tests/test-placement-routing-key.sh
      - name: Validate SaaS auto-update wiring
        run: tests/test-auto-update-saas.sh
      - name: Validate generated cluster configurations
        run: |
          tests/test-md-cluster-config.sh
          tests/test-order-cluster-c-config.sh
          tests/test-trade-cluster-config.sh
          tests/test-placement-routing-key.sh
      - name: Validate placement catalogs
        run: |
          python -m unittest tests.test_verify_placement_catalogs tests.test_md_cluster_assignment_plan tests.test_trade_cluster_assignments tests.test_trade_cluster_transition_host tests.test_md_cluster_transition_host tests.test_md_cluster_roll_drain_host
          python tests/md_cluster_transition_host.py --help >/dev/null
          python tests/md_cluster_roll_drain_host.py --help >/dev/null
          python tests/trade_cluster_bootstrap_host.py --help >/dev/null
