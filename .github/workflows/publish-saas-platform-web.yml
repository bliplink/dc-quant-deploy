name: Publish standalone SaaS platform web image

on:
  workflow_dispatch:
  push:
    branches: [saas-crypto]
    paths:
      - .github/workflows/publish-saas-platform-web.yml

concurrency:
  group: publish-standalone-saas-platform-web
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bliplink/dc-saas-platform-console
  SOURCE_BRANCH: saas
  SOURCE_REV: ebd96360f22baa83ec0b7f95c62a5c0df31715ef
  PUBLIC_SOURCE_URL: https://github.com/bliplink/dc-quant-deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out private platform web source
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch "${SOURCE_BRANCH}" \
            "https://x-access-token:${GH_REPO_TOKEN}@github.com/bliplink/dc-saas-platform-web.git" service
          git -C service checkout "${SOURCE_REV}"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          labels: |
            org.opencontainers.image.source=${{ env.PUBLIC_SOURCE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:saas
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:source-${{ env.SOURCE_REV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
