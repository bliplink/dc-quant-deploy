name: Final check dc-saas-trade-web

on:
  push:
    branches:
      - ops/final-check-dc-saas-trade-web
    paths:
      - '.github/workflows/final-check-dc-saas-trade-web.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous inspect
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f "$HOME/.docker/config.json"
          image="ghcr.io/bliplink/dc-saas-trade-web:saas-crypto"
          docker manifest inspect "$image" > /tmp/manifest.json
          grep -q '"architecture": "amd64"' /tmp/manifest.json
          grep -q '"architecture": "arm64"' /tmp/manifest.json
          echo "PUBLIC=true"
          echo "AMD64=true"
          echo "ARM64=true"
