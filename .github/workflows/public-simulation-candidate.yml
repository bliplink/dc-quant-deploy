name: Public simulation candidate images

on:
  push:
    branches: [release/public-simulation-20261126]
  workflow_dispatch:
    inputs:
      amd64_pass_only:
        description: Test an individually accepted x86_64 installation while dual-architecture packaging is still pending
        type: boolean
        default: false
      accepted_load:
        description: Run the TCP benchmark from a fully accepted release run specified in candidate_run
        type: boolean
        default: false
      candidate_run:
        description: Optional prior candidate run for installer-only diagnostics
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.candidate_run == ''
    name: Candidate ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component: [public-web, trade-web, tenant-web, platform-web, api-docs, trading-core, robot, admin-bootstrap, login, manager, liquidation, price-feed, projection]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only the pinned sources for this job
        env:
          SOURCE_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          paths=("sources/$COMPONENT")
          if [[ "$COMPONENT" == trading-core ]]; then
            paths=(sources/{gateway-api,common,shared,order,trade,market-data,gateway})
          elif [[ "$COMPONENT" == price-feed ]]; then
            paths+=(sources/futures-connector)
          fi
          git -c 'credential.https://github.com.helper=!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$SOURCE_TOKEN"; fi; }; f' \
            submodule update --init --depth 1 --jobs 3 -- "${paths[@]}"
          for path in "${paths[@]}"; do
            test "$(git -C "$path" rev-parse HEAD)" = "$(git rev-parse "HEAD:$path")"
          done
          pin="$(awk -v service="$COMPONENT" '$1 == service {print $2}' config/public-simulation-service-pins.tsv)"
          if [[ -n "$pin" ]]; then
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
            git init -q sources/shared
            git -C sources/shared remote add origin "$(git config -f .gitmodules submodule.shared.url)"
            git -C sources/shared -c 'credential.https://github.com.helper=!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$SOURCE_TOKEN"; fi; }; f' fetch --depth=1 origin "$pin"
          fi
      - uses: actions/setup-java@v4
        if: "!contains(fromJSON('[\"public-web\",\"trade-web\",\"tenant-web\",\"platform-web\",\"api-docs\"]'), matrix.component)"
        with:
          distribution: temurin
          java-version: '8'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify both runtime architectures
        env:
          MAVEN_ARGS: --settings ${{ github.workspace }}/config/public-simulation-maven-settings.xml
        run: |
          out="$RUNNER_TEMP/candidates"
          if [[ "$COMPONENT" == trading-core ]]; then
            bash scripts/build-public-simulation-core.sh "$out"
          elif awk -v service="$COMPONENT" '$1==service {found=1} END {exit !found}' config/public-simulation-service-pins.tsv; then
            bash scripts/build-public-simulation-maker.sh "$out" "$COMPONENT"
          else
            bash scripts/build-public-simulation-web.sh "$out" "$COMPONENT"
          fi
          cd "$out"
          sha256sum -- *.oci.tar >> "$GITHUB_STEP_SUMMARY"
      - name: Seal failed Common diagnostics for review
        if: failure() && matrix.component == 'trading-core'
        run: |
          if [[ -d "$RUNNER_TEMP/common-diagnostics" ]]; then
            sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
            sudo apt-get install -y --no-install-recommends age
            tar -C "$RUNNER_TEMP" -czf - common-diagnostics | age -R config/public-simulation-candidate-recipient.pub -o "$RUNNER_TEMP/common-diagnostics.tar.gz.age"
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.component == 'trading-core'
        with:
          name: common-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/common-diagnostics.tar.gz.age
          if-no-files-found: ignore
          retention-days: 3
      - name: Encrypt candidates for the release owner and the clean acceptance runner
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends age
          mkdir "$RUNNER_TEMP/sealed"
          cd "$RUNNER_TEMP/candidates"
          sha256sum -- *.oci.tar > "$RUNNER_TEMP/sealed/SHA256SUMS"
          for archive in *.oci.tar; do
            age -R "$GITHUB_WORKSPACE/config/public-simulation-candidate-recipient.pub" -R "$GITHUB_WORKSPACE/config/public-simulation-acceptance-recipient.pub" \
              -o "$RUNNER_TEMP/sealed/$archive.age" "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.component }}-${{ github.sha }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  clean-control:
    if: ${{ !inputs.accepted_load }}
    name: Fresh infrastructure and control isolation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: python3 scripts/verify-clean-simulation.py --check-control

  clean-linux:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, name: Clean Linux installation}
          - {runner: ubuntu-24.04-arm, arch: arm64, name: Clean Linux ARM64 installation}
    needs: [build, clean-control]
    if: >-
      always() && !cancelled() && !inputs.accepted_load && needs.clean-control.result == 'success' &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.candidate_run != ''))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify interrupted tenant enrollment
        run: python3 tests/test_simulation_tenant_retry.py
      - name: Install image verification tools
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends age skopeo
      - name: Load exact candidates from this run
        env:
          SIMULATION_ACCEPTANCE_AGE_KEY: ${{ secrets.SIMULATION_ACCEPTANCE_AGE_KEY }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run }}
        run: bash scripts/load-clean-simulation-candidates.sh
      - name: Run protected installation on empty storage
        id: install
        run: |
          digest="$(sha256sum "$RUNNER_TEMP/simulation-images.json" | cut -d' ' -f1)"
          "$RUNNER_TEMP/simulation-release/install.sh" "$digest" "$RUNNER_TEMP/t554-install"
          "$RUNNER_TEMP/simulation-release/install.sh" "$digest" "$RUNNER_TEMP/t554-install"
      - name: Verify ten funded tenants through the trading page
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --ignore-scripts playwright@1.58.2
          export PLAYWRIGHT_ROOT="$RUNNER_TEMP/browser/node_modules/playwright"
          if [[ "$RUNNER_ARCH" == ARM64 ]]; then
            node "$PLAYWRIGHT_ROOT/cli.js" install chromium
            export PLAYWRIGHT_BUNDLED_CHROMIUM=true
          fi
          python3 tests/verify-clean-simulation-tenants.py
      - name: Recheck the existing installation after customer trades
        run: python3 scripts/install-public-simulation.py --state-dir "$RUNNER_TEMP/t554-install"
      - name: Record the verified image manifest
        if: needs.build.result == 'success'
        run: sha256sum "$RUNNER_TEMP/simulation-images.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: accepted-linux-${{ matrix.arch }}-images-${{ github.sha }}
          path: ${{ runner.temp }}/simulation-images.json
          retention-days: 3
      - name: Preserve scoped logs if the fresh installation fails
        if: failure() && steps.install.outcome != 'skipped'
        run: |
          umask 077
          generation="$(find "$RUNNER_TEMP/t554-install" -maxdepth 1 -type d -name 'sim-demo-*' -printf '%f' 2>/dev/null || true)"
          if [[ ! "$generation" =~ ^sim-demo-[0-9]{8}-[0-9]{6}$ ]]; then exit 0; fi
          mkdir "$RUNNER_TEMP/simulation-diagnostics"
          if [[ "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' dc-saas-mysql 2>/dev/null)" == "$generation" ]]; then
            # Aggregate states only. Never export user identities, requests or credentials.
            docker exec -i dc-saas-mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -uroot -NB dc' \
              > "$RUNNER_TEMP/simulation-diagnostics/tenant-status.tsv" <<'SQL' || true
          SELECT status,step,COUNT(*) FROM dc_tenant_liquidity_bootstrap GROUP BY status,step;
          SELECT runtime_status,last_error_code,COUNT(*),SUM(open_order_count) FROM dc_tenant_robot GROUP BY runtime_status,last_error_code;
          SELECT COUNT(DISTINCT j.location) AS tenants_with_tape_fills FROM dc_tenant_liquidity_bootstrap j
            JOIN dc_orders_execorders e ON e.location=j.location AND e.user_id=j.tape_user_id
            WHERE e.exec_type='Trade' AND e.maker=0 AND e.last_qty>0 AND e.last_px>0;
          SQL
          fi
          while IFS= read -r node; do
            project="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$node")"
            if [[ "$project" == "$generation" || "$node" == "$generation"-* ]]; then
              docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$node" > "$RUNNER_TEMP/simulation-diagnostics/$node.log"
              docker logs --tail 800 "$node" >> "$RUNNER_TEMP/simulation-diagnostics/$node.log" 2>&1 || true
            fi
          done < <(docker ps -a --format '{{.Names}}')
          tar -C "$RUNNER_TEMP" -czf - simulation-diagnostics | age -R config/public-simulation-candidate-recipient.pub -o "$RUNNER_TEMP/simulation-diagnostics.tar.gz.age"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.install.outcome != 'skipped'
        with:
          name: installation-diagnostics-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simulation-diagnostics.tar.gz.age
          if-no-files-found: ignore
          retention-days: 3

  package-installer:
    name: Package accepted one-command installer
    needs: [build, clean-linux]
    if: github.event_name == 'push' && needs.build.result == 'success' && needs.clean-linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install delivery encryption tool
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Assemble the same sixteen images verified on both hosts
        env:
          SIMULATION_ACCEPTANCE_AGE_KEY: ${{ secrets.SIMULATION_ACCEPTANCE_AGE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/load-clean-simulation-candidates.sh
      - name: Verify both acceptance manifests and seal the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          for arch in amd64 arm64; do
            gh run download "$GITHUB_RUN_ID" --name "accepted-linux-$arch-images-$GITHUB_SHA" --dir "$RUNNER_TEMP/accepted-$arch"
            cmp "$RUNNER_TEMP/accepted-$arch/simulation-images.json" "$RUNNER_TEMP/simulation-release/simulation-images.json"
          done
          output="$RUNNER_TEMP/accepted-installer"
          mkdir "$output"
          tar -C "$RUNNER_TEMP" -cf - simulation-release | age -R config/public-simulation-candidate-recipient.pub -o "$output/simulation-release.tar.age"
          cp "$RUNNER_TEMP/simulation-release/simulation-images.json" "$output/"
          (cd "$output" && sha256sum simulation-release.tar.age simulation-images.json > SHA256SUMS)
          cat "$output/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-installer-${{ github.sha }}
          path: ${{ runner.temp }}/accepted-installer/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  installed-tcp-load:
    name: Pressure test the accepted Linux installer over TCP
    if: github.event_name == 'workflow_dispatch' && inputs.accepted_load && inputs.candidate_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the exact successful installation and package run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_RUN: ${{ inputs.candidate_run }}
          AMD64_PASS_ONLY: ${{ inputs.amd64_pass_only }}
        run: |
          [[ "$ACCEPTED_RUN" =~ ^[0-9]+$ ]]
          revision="$(gh run view "$ACCEPTED_RUN" --json headSha,headBranch,event,conclusion,workflowName,jobs | jq -r --arg amd64 "$AMD64_PASS_ONLY" '
            select(.headBranch == "release/public-simulation-20261126" and .event == "push"
              and .workflowName == "Public simulation candidate images"
              and any(.jobs[]; .name == "Clean Linux installation" and .conclusion == "success")
              and ($amd64 == "true" or (.conclusion == "success"
                and any(.jobs[]; .name == "Clean Linux ARM64 installation" and .conclusion == "success")
                and any(.jobs[]; .name == "Package accepted one-command installer" and .conclusion == "success")))) | .headSha')"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.revision }}
          path: accepted-deployment
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install image verification tools
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends age skopeo
      - name: Reassemble the verified release images and installer
        working-directory: accepted-deployment
        env:
          SIMULATION_ACCEPTANCE_AGE_KEY: ${{ secrets.SIMULATION_ACCEPTANCE_AGE_KEY }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run }}
          ACCEPTED_REVISION: ${{ steps.release.outputs.revision }}
          AMD64_PASS_ONLY: ${{ inputs.amd64_pass_only }}
        run: |
          GITHUB_SHA="$ACCEPTED_REVISION" GITHUB_WORKSPACE="$PWD" bash scripts/load-clean-simulation-candidates.sh
          architectures=(amd64)
          if [[ "$AMD64_PASS_ONLY" != true ]]; then architectures+=(arm64); fi
          for arch in "${architectures[@]}"; do
            gh run download "$CANDIDATE_RUN_ID" --name "accepted-linux-$arch-images-$ACCEPTED_REVISION" --dir "$RUNNER_TEMP/accepted-$arch"
            cmp "$RUNNER_TEMP/accepted-$arch/simulation-images.json" "$RUNNER_TEMP/simulation-images.json"
          done
          sha256sum "$RUNNER_TEMP/simulation-images.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the accepted one-command installation on empty storage
        run: |
          digest="$(sha256sum "$RUNNER_TEMP/simulation-images.json" | cut -d' ' -f1)"
          "$RUNNER_TEMP/simulation-release/install.sh" "$digest" "$RUNNER_TEMP/t554-install"
          "$RUNNER_TEMP/simulation-release/install.sh" "$digest" "$RUNNER_TEMP/t554-install"
      - name: Measure funded TCP place, cancel and final settlement
        env:
          T554_HOSTED_TARGET_LOAD: 'true'
        run: python3 tests/measure-hosted-simulation-tcp.py
