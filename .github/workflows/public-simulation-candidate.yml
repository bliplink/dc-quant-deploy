name: Public simulation candidate images

on:
  push:
    branches: [release/public-simulation-20261126]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Candidate ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [public-web, trade-web, tenant-web, platform-web, api-docs, trading-core, robot, admin-bootstrap]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only the pinned sources for this job
        env:
          SOURCE_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          paths=("sources/$COMPONENT")
          if [[ "$COMPONENT" == trading-core ]]; then
            paths=(sources/{gateway-api,common,shared,order,trade,market-data})
          elif [[ "$COMPONENT" == robot || "$COMPONENT" == admin-bootstrap ]]; then
            paths+=(sources/shared)
            if [[ "$COMPONENT" == admin-bootstrap ]]; then paths+=(sources/admin-public-stats); fi
          fi
          git -c 'credential.https://github.com.helper=!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$SOURCE_TOKEN"; fi; }; f' \
            submodule update --init --depth 1 --jobs 3 -- "${paths[@]}"
          for path in "${paths[@]}"; do
            test "$(git -C "$path" rev-parse HEAD)" = "$(git rev-parse "HEAD:$path")"
          done
          if [[ "$COMPONENT" == robot || "$COMPONENT" == admin-bootstrap ]]; then
            pin=d3fdaf16a6b8d70e9e81647af459ac6cc4090b37
            if [[ "$COMPONENT" == admin-bootstrap ]]; then pin=2fa804757c561fc9bbd0642a5c2153fca55cf286; fi
            git -C sources/shared -c 'credential.https://github.com.helper=!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$SOURCE_TOKEN"; fi; }; f' fetch --depth=1 origin "$pin"
          fi
      - uses: actions/setup-java@v4
        if: contains(fromJSON('["trading-core","robot","admin-bootstrap"]'), matrix.component)
        with:
          distribution: temurin
          java-version: '8'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify both runtime architectures
        run: |
          out="$RUNNER_TEMP/candidates"
          if [[ "$COMPONENT" == trading-core ]]; then
            bash scripts/build-public-simulation-core.sh "$out"
          elif [[ "$COMPONENT" == robot || "$COMPONENT" == admin-bootstrap ]]; then
            bash scripts/build-public-simulation-maker.sh "$out" "$COMPONENT"
          else
            bash scripts/build-public-simulation-web.sh "$out" "$COMPONENT"
          fi
          cd "$out"
          sha256sum -- *.oci.tar >> "$GITHUB_STEP_SUMMARY"
      - name: Seal verified candidates for acceptance on the original Mac
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          mkdir "$RUNNER_TEMP/sealed"
          cd "$RUNNER_TEMP/candidates"
          sha256sum -- *.oci.tar > "$RUNNER_TEMP/sealed/SHA256SUMS"
          for archive in *.oci.tar; do
            age -R "$GITHUB_WORKSPACE/config/public-simulation-candidate-recipient.pub" \
              -o "$RUNNER_TEMP/sealed/$archive.age" "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.component }}-${{ github.sha }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
