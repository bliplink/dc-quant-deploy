        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch "${SOURCE_BRANCH}"             "https://x-access-token:${GH_REPO_TOKEN}@github.com/SKT-Walter/dc-trade-web.git" service
          git -C service fetch --depth 1 origin "${SOURCE_REV}"
          git -C service checkout --detach FETCH_HEAD
          test "$(git -C service rev-parse HEAD)" = "${SOURCE_REV}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          labels: |
            org.opencontainers.image.source=${{ env.PUBLIC_SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.SOURCE_REV }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:saas-crypto
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:source-${{ env.SOURCE_REV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
