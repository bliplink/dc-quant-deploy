name: Publish standalone SaaS web image

on:
  workflow_dispatch:
  push:
    branches: [saas-crypto]
    paths:
      - .github/workflows/publish-saas-web.yml

concurrency:
  group: publish-standalone-saas-web
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bliplink/dc-saas-trade-web
  SOURCE_BRANCH: saas-crypto
  SOURCE_REV: 6c657767e3e24d0ac65b1790f17f1d36fc698b3a
  PUBLIC_SOURCE_URL: https://github.com/bliplink/dc-quant-deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out private web source
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch "${SOURCE_BRANCH}" \
            "https://x-access-token:${GH_REPO_TOKEN}@github.com/SKT-Walter/dc-trade-web.git" service
          git -C service checkout "${SOURCE_REV}"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          labels: |
            org.opencontainers.image.source=${{ env.PUBLIC_SOURCE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:saas-crypto
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:source-${{ env.SOURCE_REV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
