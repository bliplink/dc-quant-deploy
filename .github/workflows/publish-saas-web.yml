name: Publish standalone SaaS web image

on:
  workflow_dispatch:
  push:
    branches: [saas-crypto]
    paths:
      - .github/workflows/publish-saas-web.yml

concurrency:
  group: publish-standalone-saas-web
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bliplink/dc-trade-web
  SOURCE_BRANCH: saas-crypto
  SOURCE_REV: b976b647acc4306f68e4ba446b64f1a389d804ed
  PUBLIC_SOURCE_URL: https://github.com/bliplink/dc-quant-deploy

jobs:
  source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out pinned private Web source
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch "${SOURCE_BRANCH}" \
            "https://x-access-token:${GH_REPO_TOKEN}@github.com/bliplink/dc-trade-web.git" service
          git -C service fetch --depth 1 origin "${SOURCE_REV}"
          git -C service checkout --detach FETCH_HEAD
          test "$(git -C service rev-parse HEAD)" = "${SOURCE_REV}"

      - name: Build pinned source image
        run: docker build -t dc-trade-web-publish:acceptance service

      - name: Install Chromium acceptance runner
        run: |
          mkdir -p /tmp/dc-trade-publish /tmp/dc-trade-publish-artifacts
          cd /tmp/dc-trade-publish
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-visual.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-functional.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-functional-edge.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-functional-faults.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-functional-config.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-market-health.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-position-close.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-protection.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-order-lifecycle.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-history.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-disconnect-transaction.mjs .
          cp "$GITHUB_WORKSPACE"/service/.github/capture-trade-stress.mjs .

      - name: Verify source policies
        run: |
          node service/.github/test-kline-subscription-lifecycle.mjs
          node service/.github/test-market-health-policy.mjs

      - name: Install mock gateway dependency
        run: python3 -m pip install --disable-pip-version-check websockets==12.0

      - name: Start isolated visual runtime
        run: |
          nohup python3 service/.github/mock_gateway.py > mock-gateway-visual.log 2>&1 &
          echo $! > mock-gateway.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '^ok$'
          docker run -d --name dc-trade-web-publish \
            --network host \
            -e WEB_LISTEN_PORT=18088 \
            -e GATEWAY_HOST=127.0.0.1 \
            -e GATEWAY_HTTP_PORT=18080 \
            -e GATEWAY_WS_PORT=18081 \
            -e TENANT_WEB_HOST=127.0.0.1 \
            -e TENANT_WEB_PORT=65532 \
            dc-trade-web-publish:acceptance
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/healthz | grep -q '^ok$'; then
              exit 0
            fi
            sleep 1
          done
          docker logs dc-trade-web-publish
          exit 1

      - name: Run visual acceptance
        run: |
          cd /tmp/dc-trade-publish
          node capture-trade-visual.mjs /tmp/dc-trade-publish-artifacts
          test -s /tmp/dc-trade-publish-artifacts/trade-web-mock-mobile-360x800.png
          test -s /tmp/dc-trade-publish-artifacts/trade-web-mock-mobile-390x844.png
          test -s /tmp/dc-trade-publish-artifacts/trade-web-mock-mobile-430x932.png
          test -s /tmp/dc-trade-publish-artifacts/trade-web-mock-mobile-landscape-chart-844x390.png
          test -s /tmp/dc-trade-publish-artifacts/trade-web-mock-mobile-landscape-order-844x390.png

      - name: Reset isolated runtime for functional acceptance
        run: |
          docker rm -f dc-trade-web-publish >/dev/null 2>&1 || true
          kill "$(cat mock-gateway.pid)" >/dev/null 2>&1 || true
          sleep 1
          nohup python3 service/.github/mock_gateway.py > mock-gateway-functional.log 2>&1 &
          echo $! > mock-gateway.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '^ok$'
          docker run -d --name dc-trade-web-publish \
            --network host \
            -e WEB_LISTEN_PORT=18088 \
            -e GATEWAY_HOST=127.0.0.1 \
            -e GATEWAY_HTTP_PORT=18080 \
            -e GATEWAY_WS_PORT=18081 \
            -e TENANT_WEB_HOST=127.0.0.1 \
            -e TENANT_WEB_PORT=65532 \
            dc-trade-web-publish:acceptance
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/healthz | grep -q '^ok$'; then
              exit 0
            fi
            sleep 1
          done
          docker logs dc-trade-web-publish
          exit 1

      - name: Run functional acceptance
        run: |
          cd /tmp/dc-trade-publish
          for script in \
            capture-trade-functional.mjs \
            capture-trade-functional-config.mjs \
            capture-trade-market-health.mjs \
            capture-trade-position-close.mjs \
            capture-trade-protection.mjs \
            capture-trade-order-lifecycle.mjs \
            capture-trade-history.mjs \
            capture-trade-disconnect-transaction.mjs \
            capture-trade-functional-edge.mjs \
            capture-trade-functional-faults.mjs; do
            node "$script" /tmp/dc-trade-publish-artifacts
          done

      - name: Reset isolated runtime for stress acceptance
        run: |
          docker rm -f dc-trade-web-publish >/dev/null 2>&1 || true
          kill "$(cat mock-gateway.pid)" >/dev/null 2>&1 || true
          sleep 1
          nohup python3 service/.github/mock_gateway.py > mock-gateway-stress.log 2>&1 &
          echo $! > mock-gateway.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '^ok$'
          docker run -d --name dc-trade-web-publish \
            --network host \
            -e WEB_LISTEN_PORT=18088 \
            -e GATEWAY_HOST=127.0.0.1 \
            -e GATEWAY_HTTP_PORT=18080 \
            -e GATEWAY_WS_PORT=18081 \
            -e TENANT_WEB_HOST=127.0.0.1 \
            -e TENANT_WEB_PORT=65532 \
            dc-trade-web-publish:acceptance
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/healthz | grep -q '^ok$'; then
              exit 0
            fi
            sleep 1
          done
          docker logs dc-trade-web-publish
          exit 1

      - name: Run stress acceptance
        run: |
          cd /tmp/dc-trade-publish
          node capture-trade-stress.mjs /tmp/dc-trade-publish-artifacts

      - name: Upload pinned-source acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dc-saas-trade-web-source-acceptance
          path: |
            /tmp/dc-trade-publish-artifacts
            mock-gateway-visual.log
            mock-gateway-functional.log
            mock-gateway-stress.log
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnostics
        if: always()
        run: |
          echo "SOURCE_REV=${SOURCE_REV}"
          for log_file in mock-gateway-visual.log mock-gateway-functional.log mock-gateway-stress.log; do
            echo "--- ${log_file} ---"
            tail -n 300 "${log_file}" 2>/dev/null || true
          done
          echo '--- trade web ---'
          docker logs dc-trade-web-publish 2>/dev/null || true

  build-and-push:
    needs: source-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out pinned private Web source
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch "${SOURCE_BRANCH}" \
            "https://x-access-token:${GH_REPO_TOKEN}@github.com/bliplink/dc-trade-web.git" service
          git -C service fetch --depth 1 origin "${SOURCE_REV}"
          git -C service checkout --detach FETCH_HEAD
          test "$(git -C service rev-parse HEAD)" = "${SOURCE_REV}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: service
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=${{ env.PUBLIC_SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.SOURCE_REV }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:saas-crypto
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:source-${{ env.SOURCE_REV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
