name: Validate Mac staged-runtime purge safety
on:
  workflow_dispatch:
  push:
    branches: [saas-crypto]
    paths:
      - .github/workflows/validate-macos-purge-quarantine.yml
      - scripts/mac-saas-purge-quarantine.py
      - tests/test_mac_saas_purge_quarantine.py
      - tests/test_deploy_saas_macos.py
      - deploy-saas-macos.sh
      - docs/MAC_MINI_ONECLICK_USAGE_20261010.zh-CN.md
  pull_request:
    paths:
      - .github/workflows/validate-macos-purge-quarantine.yml
      - scripts/mac-saas-purge-quarantine.py
      - tests/test_mac_saas_purge_quarantine.py
      - tests/test_deploy_saas_macos.py
      - deploy-saas-macos.sh
      - docs/MAC_MINI_ONECLICK_USAGE_20261010.zh-CN.md
permissions:
  contents: read
jobs:
  purge-only-old-root:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and lint the guardrails
        run: |
          python3 -m py_compile scripts/mac-saas-purge-quarantine.py
          bash -n deploy-saas-macos.sh
      - name: Reject unsafe paths, images, mounts, proof, and network failures
        run: python3 -m unittest discover -s tests -p 'test_mac_saas_purge_quarantine.py' -v
      - name: Verify Mac one-click command dispatch
        run: python3 -m unittest discover -s tests -p 'test_deploy_saas_macos.py' -v
