name: Check public GHCR images

on:
  push:
    branches:
      - ops/check-public-ghcr
    paths:
      - '.github/workflows/check-public-ghcr.yml'
  workflow_dispatch:

jobs:
  anonymous-pull-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure anonymous GHCR access
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f "$HOME/.docker/config.json"

      - name: Check public images
        shell: bash
        run: |
          set +e
          images=(
            ghcr.io/bliplink/ordersvr:saas-crypto
            ghcr.io/bliplink/tradesvr:saas-crypto
            ghcr.io/bliplink/projectionsvr:saas-crypto
            ghcr.io/bliplink/mdsvr:saas-crypto
            ghcr.io/bliplink/liqsvr:saas-crypto
            ghcr.io/bliplink/gw:saas-crypto
            ghcr.io/bliplink/robotsvr:saas-crypto
            ghcr.io/bliplink/apssvr:saas-crypto
            ghcr.io/bliplink/adminsvr:saas-crypto
            ghcr.io/bliplink/managersvr:saas-crypto
            ghcr.io/bliplink/loginsvr:saas-crypto
            ghcr.io/bliplink/dc-trade-web:saas-crypto
            ghcr.io/bliplink/dc-saas-tenant-web:saas-crypto
            ghcr.io/bliplink/dc-saas-platform-web:saas-crypto
          )
          failed=0
          echo "===== ANONYMOUS GHCR PULL CHECK ====="
          for image in "${images[@]}"; do
            echo "::group::CHECK ${image}"
            if docker pull "${image}"; then
              echo "RESULT PUBLIC ${image}"
            else
              echo "RESULT FAIL ${image}"
              failed=1
            fi
            echo "::endgroup::"
          done
          echo "===== SUMMARY ====="
          if [ "${failed}" -eq 0 ]; then
            echo "ALL_PUBLIC=true"
          else
            echo "ALL_PUBLIC=false"
          fi
          exit "${failed}"
