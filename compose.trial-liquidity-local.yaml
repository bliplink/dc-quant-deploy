# Opt-in local Demo onboarding only. Never combine this override with a
# real-funds environment. Production must use a dedicated master key and an
# idempotent TradeSvr cash API before enabling automatic funding.
services:
  adminsvr:
    environment:
      TRIAL_LIQUIDITY_BOOTSTRAP_ENABLED: "true"
      TRIAL_LIQUIDITY_DEMO_RETRY_ENABLED: "false"
      TRIAL_LIQUIDITY_MASTER_KEY: ${TRIAL_LIQUIDITY_MASTER_KEY:?stable isolated trial liquidity key required}
      TRIAL_LIQUIDITY_CASH_AMOUNT: "10000"
      TRIAL_LIQUIDITY_MARGIN_BUDGET: "1000"
      TRIAL_LIQUIDITY_TAPE_ENABLED: ${TRIAL_LIQUIDITY_TAPE_ENABLED:-false}
      TRIAL_LIQUIDITY_TAPE_CANARY_LOCATION: ${TRIAL_LIQUIDITY_TAPE_CANARY_LOCATION:-}
      TRIAL_LIQUIDITY_TAPE_CASH_AMOUNT: ${TRIAL_LIQUIDITY_TAPE_CASH_AMOUNT:-10000}