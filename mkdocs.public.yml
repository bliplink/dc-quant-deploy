site_name: OpenTradingCore Developers
site_description: English Developer Preview for OpenTradingCore APIs
site_url: https://api.opentradingcore.com/en/
docs_dir: docs/en
site_dir: site/en

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: slate
    primary: blue
    accent: blue

plugins:
  - search

extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 简体中文
      link: /zh/
      lang: zh

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - assets/language-switch.js

nav:
  - Overview: index.md
  - Get started:
      - Quick start: quick-start.md
      - Authentication: authentication.md
      - Rate limits: rate-limits.md
  - Trader API: trader.md
  - Broker API: broker.md
  - Realtime: realtime.md
  - Reference:
      - YAML-derived method catalog: openapi/CATALOG_GENERATED.md
      - Changes: changelog.md
      - Release status: status.md
