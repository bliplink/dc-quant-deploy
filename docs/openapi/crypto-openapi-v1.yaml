openapi: 3.0.3
info:
  title: DC Crypto Open API v1 - GW Native HTTP Transport
  version: 1.0.0
  description: |
    DC Open API v1 deliberately reuses the existing GW envelope instead of
    introducing Binance-style REST paths or a separate OpenApiSvr. Business
    semantics remain owned by LoginSvr, MDSvr, OrderSvr, TradeSvr,
    ProjectionSvr, AdminSvr and ManagerSvr.
servers:
  - url: /
tags:
  - name: api-key
  - name: session
paths:
  /api:
    post:
      tags: [api-key]
      summary: Signed API-key request
      description: |
        Canonical v1 use is LoginSvr/apiKeyLogin to exchange an API key for a
        tenant-scoped user session. signature = HEX(HMAC-SHA256(secret_key,
        UTF8(raw_http_body + expiry))). expiry is epoch milliseconds.
        LoginSvr snapshots api_key_type, permissions and rate_limit_profile
        into the returned session. That snapshot is authoritative for the
        lifetime of the session and request content cannot widen it.
      security:
        - DcApiKey: []
      parameters:
        - name: cid
          in: header
          required: false
          schema: { type: string }
        - name: expiry
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GwEnvelope'
            examples:
              apiKeyLogin:
                value:
                  serverName: LoginSvr
                  method: apiKeyLogin
                  content:
                    api_key: 0123456789abcdef
                    location: TENANT_A
                    cid: robot-auth-001
      responses:
        '200':
          description: GW business response; inspect code/msg/data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GwResponse'
              examples:
                traderSession:
                  value:
                    code: 0
                    msg: NO_ERROR
                    data:
                      client_type: API
                      user_id: '500020'
                      location: TENANT_A
                      token: opaque-session-token
                      sid: opaque-session-token
                      api_key_type: trade
                      permissions: MARKET_READ,ACCOUNT_READ,ORDER_READ,ORDER_WRITE
                      rate_limit_profile: TRADER_STANDARD
  /httpapi/:
    post:
      tags: [session]
      summary: Session-authenticated GW request
      description: |
        Used by Trade Web, Tenant Web and Open API clients after login.
        Downstream services bind authoritative location/user identity from the
        LoginSvr session; caller supplied identity cannot widen scope.
        API/TenantAPI sessions carry the permission snapshot so downstream
        services have one authoritative field/model for scope checks. Broker
        keys use client_type=TenantAPI with api_key_type=broker and may enter
        scoped Order/Trade customer operations only for customers owned by the
        same authoritative location. Phase 2
        permits only non-empty subsets of the scope class assigned to each key
        type, while preserving the client-type boundary. Order/Trade/MD/
        Projection/Admin enforce the required scope at runtime. Token refresh/
        resume preserves the same snapshot. Pre-upgrade API sessions without a
        persisted snapshot fail closed and must perform signed API-key login
        again.
      parameters:
        - name: sessionId
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GwEnvelope'
            examples:
              queryOpenOrder:
                value:
                  serverName: OrderSvr
                  method: queryOpenOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
              placeOrder:
                value:
                  serverName: OrderSvr
                  method: placeOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
                    Side: BUY
                    OCType: OPEN
                    OrdType: Limit
                    TimeInForce: GTC
                    OrderQty: '0.010'
                    Price: '60000.0'
                    ClOrdID: tenant-robot-000001
              cancelOrder:
                value:
                  serverName: OrderSvr
                  method: cancelOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
                    OrderID: server-order-id
                    ClOrdID: cancel-request-000001
              queryAccountBalance:
                value:
                  serverName: TradeSvr
                  method: queryAccountBalance
                  content: {}
              queryTradePosition:
                value:
                  serverName: TradeSvr
                  method: queryTradePosition
                  content:
                    securityid: BTCUSDT
      responses:
        '200':
          description: GW business response; inspect code/msg/data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GwResponse'
components:
  securitySchemes:
    DcApiKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    GwEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          description: Stable DC service contract name.
          enum:
            - LoginSvr
            - MDSvr
            - OrderSvr
            - TradeSvr
            - ProjectionSvr
            - AdminSvr
            - ManagerSvr
        method:
          type: string
          description: Stable v1 method name from the published API catalog.
        content:
          description: Method-specific request object.
          oneOf:
            - type: object
            - type: string
    PlaceOrderContent:
      type: object
      required:
        - SecurityID
        - MarketIndicator
        - Side
        - OCType
        - OrdType
        - OrderQty
        - ClOrdID
      properties:
        SecurityID:
          type: string
          example: BTCUSDT
        MarketIndicator:
          type: string
          example: '4'
        Side:
          type: string
          enum: [BUY, SELL, Buy, Sell]
        OCType:
          type: string
          enum: [OPEN, CLOSE]
        OrdType:
          type: string
          enum: [Limit, Market]
        TimeInForce:
          type: string
          enum: [GTC, IOC, FOK, PO]
        OrderQty:
          type: string
          description: Decimal quantity encoded as string.
          example: '0.010'
        Price:
          type: string
          description: Required by Limit orders; decimal encoded as string.
          example: '60000.0'
        ClOrdID:
          type: string
          description: Client order id / idempotency and tracking key.
          example: client-order-000001
        ReduceOnly:
          description: Reduce-only flag. Current runtime accepts boolean/string compatibility forms.
          oneOf:
            - type: boolean
            - type: string
              enum: ['true', 'false', '0', '1']
        Location:
          type: string
          description: Broker target-customer compatibility field. Trader identity remains session-authoritative.
        UserID:
          type: string
          description: Broker target customer user id; ignored/rejected when it would widen session scope.

    PlaceOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [OrderSvr]
        method:
          type: string
          enum: [placeOrder]
        content:
          $ref: '#/components/schemas/PlaceOrderContent'

    CancelOrderContent:
      type: object
      required:
        - SecurityID
        - MarketIndicator
        - OrderID
        - ClOrdID
      properties:
        SecurityID:
          type: string
          example: BTCUSDT
        MarketIndicator:
          type: string
          example: '4'
        OrderID:
          type: string
          description: Server order id.
        ClOrdID:
          type: string
          description: Client id for this cancel request.
        Location:
          type: string
          description: Broker target-customer compatibility field.
        UserID:
          type: string
          description: Broker target customer user id.

    CancelOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [OrderSvr]
        method:
          type: string
          enum: [cancelOrder]
        content:
          $ref: '#/components/schemas/CancelOrderContent'

    QueryOpenOrderContent:
      type: object
      properties:
        securityid:
          type: string
          description: Legacy query field currently consumed by runtime.
          example: BTCUSDT
        marketIndicator:
          type: string
          example: '4'
        maxOrderCount:
          type: integer
          minimum: 1
          example: 100
        Location:
          type: string
          description: Broker compatibility field; must match authoritative session location.
        userid:
          type: string
          description: Broker target customer id.
        SecurityID:
          type: string
          description: Canonical alias retained for runtime compatibility.
        MarketIndicator:
          type: string
          description: Canonical alias retained for runtime compatibility.

    QueryOpenOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [OrderSvr]
        method:
          type: string
          enum: [queryOpenOrder]
        content:
          $ref: '#/components/schemas/QueryOpenOrderContent'

    QueryAccountBalanceContent:
      type: object
      properties:
        userid:
          type: string
          description: Broker target customer id. Trader normally sends an empty object.
        location:
          type: string
          description: Broker customer location; must equal Broker authoritative location.

    QueryAccountBalanceEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [TradeSvr]
        method:
          type: string
          enum: [queryAccountBalance]
        content:
          $ref: '#/components/schemas/QueryAccountBalanceContent'

    QueryTradePositionContent:
      type: object
      properties:
        securityid:
          type: string
          example: BTCUSDT
        userid:
          type: string
          description: Broker target customer id.
        location:
          type: string
          description: Broker customer location; must equal Broker authoritative location.

    QueryTradePositionEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [TradeSvr]
        method:
          type: string
          enum: [queryTradePosition]
        content:
          $ref: '#/components/schemas/QueryTradePositionContent'

    OpenApiSessionIdentity:
      type: object
      required:
        - client_type
        - user_id
        - location
        - token
        - api_key_type
        - permissions
        - rate_limit_profile
      properties:
        client_type:
          type: string
          enum: [API, TenantAPI]
        user_id:
          type: string
        location:
          type: string
        token:
          type: string
        sid:
          type: string
        api_key_type:
          type: string
          enum: [trade, broker, tenant, service]
        permissions:
          type: string
          description: Comma-separated v1 scopes; exact-scope matching is required.
        rate_limit_profile:
          type: string
          example: TRADER_STANDARD
    GwResponse:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: |
            DC Open API v1 public response code. Success is 0. Non-zero
            backend codes outside this public whitelist are normalized by GW
            to 9000 (INTERNAL_ERROR).
          enum:
            - 0
            - 1
            - 1004
            - 1005
            - 1006
            - 1007
            - 1050
            - 5000
            - 5001
            - 5002
            - 5003
            - 5004
            - 7000
            - 7001
            - 7002
            - 7003
            - 7004
            - 8000
            - 9000
            - 9001
            - 9002
            - 9004
            - 9005
            - 9006
            - 9007
            - 9008
            - 9009
            - 9016
            - 9018
            - 9019
            - 10000
            - 10003
            - 10004
            - 10005
        msg:
          type: string
          description: |
            Stable public message for non-zero codes. Internal exception text,
            SQL, stack traces, file paths and cluster internals are never part
            of the Open API v1 response contract.
        data:
          nullable: true
        info1:
          nullable: true
        info2:
          nullable: true
        cid:
          type: string
          nullable: true
x-dc-method-schemas:
  'OrderSvr/placeOrder':
    request: '#/components/schemas/PlaceOrderEnvelope'
  'OrderSvr/cancelOrder':
    request: '#/components/schemas/CancelOrderEnvelope'
  'OrderSvr/queryOpenOrder':
    request: '#/components/schemas/QueryOpenOrderEnvelope'
  'TradeSvr/queryAccountBalance':
    request: '#/components/schemas/QueryAccountBalanceEnvelope'
  'TradeSvr/queryTradePosition':
    request: '#/components/schemas/QueryTradePositionEnvelope'

x-dc-v1-catalog:
  authentication:
    LoginSvr:
      apiKeyLogin: SIGNED_API_KEY
      updateApiKey: INTERACTIVE_SESSION
      queryApiKey: INTERACTIVE_SESSION
      deleteApiKey: INTERACTIVE_SESSION
      tenantApiKeyAdmin: TENANT_ADMIN
  market:
    MDSvr:
      queryPublicMarket: MARKET_READ
      queryKLine: MARKET_READ
  trading:
    OrderSvr:
      placeOrder: ORDER_WRITE
      cancelOrder: ORDER_WRITE
      cancelBatchOrder: ORDER_WRITE
      queryOrder: ORDER_READ
      queryOpenOrder: ORDER_READ
      queryExecOrder: ORDER_READ
  account:
    TradeSvr:
      queryAccountBalance: ACCOUNT_READ
      queryTradePosition: ACCOUNT_READ
      getAccountConfig: ACCOUNT_READ
      setLeverage: ORDER_WRITE
      setPositionType: ORDER_WRITE
      cashIn: CUSTOMER_CASH
      cashOut: CUSTOMER_CASH
  history:
    ProjectionSvr:
      queryProjectedOrderHistory: ORDER_READ
      queryProjectedExecutionHistory: ORDER_READ
  tenant:
    AdminSvr:
      tenantUserAdmin: TENANT_READ_OR_WRITE
      tenantSymbolAdmin: TENANT_READ_OR_WRITE
      tenantRobotAdmin: TENANT_READ_OR_WRITE
      tenantSettingsAdmin: TENANT_READ_OR_WRITE
      tenantTradeAdmin: TENANT_READ
      tenantUserRegistration: PUBLIC_POLICY_GATED
