openapi: 3.0.3
info:
  title: DC Crypto Open API v1 - GW Native HTTP Transport
  version: 1.0.0
  description: |
    DC Open API v1 deliberately reuses the existing GW envelope instead of
    introducing Binance-style REST paths or a separate OpenApiSvr. Business
    semantics remain owned by LoginSvr, MDSvr, OrderSvr, TradeSvr,
    ProjectionSvr, AdminSvr and ManagerSvr.
servers:
  - url: /
tags:
  - name: api-key
  - name: session
paths:
  /api:
    post:
      tags: [api-key]
      summary: Signed API-key request
      description: |
        Canonical v1 use is LoginSvr/apiKeyLogin to exchange an API key for a
        tenant-scoped user session. signature = HEX(HMAC-SHA256(secret_key,
        UTF8(raw_http_body + expiry))). expiry is epoch milliseconds.
        LoginSvr snapshots api_key_type, permissions and rate_limit_profile
        into the returned session. That snapshot is authoritative for the
        lifetime of the session and request content cannot widen it.
      security:
        - DcApiKey: []
      parameters:
        - name: cid
          in: header
          required: false
          schema: { type: string }
        - name: expiry
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GwEnvelope'
            examples:
              apiKeyLogin:
                value:
                  serverName: LoginSvr
                  method: apiKeyLogin
                  content:
                    api_key: 0123456789abcdef
                    location: TENANT_A
                    cid: robot-auth-001
      responses:
        '200':
          description: GW business response; inspect code/msg/data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GwResponse'
              examples:
                traderSession:
                  value:
                    code: 0
                    msg: NO_ERROR
                    data:
                      client_type: API
                      user_id: '500020'
                      location: TENANT_A
                      token: opaque-session-token
                      sid: opaque-session-token
                      api_key_type: trade
                      permissions: MARKET_READ,ACCOUNT_READ,ORDER_READ,ORDER_WRITE
                      rate_limit_profile: TRADER_STANDARD
  /httpapi/:
    post:
      tags: [session]
      summary: Session-authenticated GW request
      description: |
        Used by Trade Web, Tenant Web and Open API clients after login.
        Downstream services bind authoritative location/user identity from the
        LoginSvr session; caller supplied identity cannot widen scope.
        API/TenantAPI sessions carry the permission snapshot so downstream
        services have one authoritative field/model for scope checks. Broker
        keys use client_type=TenantAPI with api_key_type=broker and may enter
        scoped Order/Trade customer operations only for customers owned by the
        same authoritative location. Phase 2
        permits only non-empty subsets of the scope class assigned to each key
        type, while preserving the client-type boundary. Order/Trade/MD/
        Projection/Admin enforce the required scope at runtime. Token refresh/
        resume preserves the same snapshot. Pre-upgrade API sessions without a
        persisted snapshot fail closed and must perform signed API-key login
        again.
      parameters:
        - name: sessionId
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GwEnvelope'
            examples:
              queryOpenOrder:
                value:
                  serverName: OrderSvr
                  method: queryOpenOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
              placeOrder:
                value:
                  serverName: OrderSvr
                  method: placeOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
                    Side: BUY
                    OCType: OPEN
                    OrdType: Limit
                    TimeInForce: GTC
                    OrderQty: '0.010'
                    Price: '60000.0'
                    ClOrdID: tenant-robot-000001
              cancelOrder:
                value:
                  serverName: OrderSvr
                  method: cancelOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
                    OrderID: server-order-id
                    ClOrdID: cancel-request-000001
              queryAccountBalance:
                value:
                  serverName: TradeSvr
                  method: queryAccountBalance
                  content: {}
              queryTradePosition:
                value:
                  serverName: TradeSvr
                  method: queryTradePosition
                  content:
                    securityid: BTCUSDT
      responses:
        '200':
          description: GW business response; inspect code/msg/data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GwResponse'
components:
  securitySchemes:
    DcApiKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    GwEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          description: Stable DC service contract name.
          enum:
            - LoginSvr
            - MDSvr
            - OrderSvr
            - TradeSvr
            - ProjectionSvr
            - AdminSvr
            - ManagerSvr
        method:
          type: string
          description: Stable v1 method name from the published API catalog.
        content:
          description: Method-specific request object.
          oneOf:
            - type: object
            - type: string
    PlaceOrderContent:
      type: object
      required:
        - SecurityID
        - MarketIndicator
        - Side
        - OCType
        - OrdType
        - OrderQty
        - ClOrdID
      properties:
        SecurityID:
          type: string
          example: BTCUSDT
        MarketIndicator:
          type: string
          example: '4'
        Side:
          type: string
          enum: [BUY, SELL, Buy, Sell]
        OCType:
          type: string
          enum: [OPEN, CLOSE]
        OrdType:
          type: string
          enum: [Limit, Market]
        TimeInForce:
          type: string
          enum: [GTC, IOC, FOK, PO]
        OrderQty:
          type: string
          description: Decimal quantity encoded as string.
          example: '0.010'
        Price:
          type: string
          description: Required by Limit orders; decimal encoded as string.
          example: '60000.0'
        ClOrdID:
          type: string
          description: Client order id / idempotency and tracking key.
          example: client-order-000001
        ReduceOnly:
          description: Reduce-only flag. Current runtime accepts boolean/string compatibility forms.
          oneOf:
            - type: boolean
            - type: string
              enum: ['true', 'false', '0', '1']
        Location:
          type: string
          description: Broker target-customer compatibility field. Trader identity remains session-authoritative.
        UserID:
          type: string
          description: Broker target customer user id; ignored/rejected when it would widen session scope.

    PlaceOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [OrderSvr]
        method:
          type: string
          enum: [placeOrder]
        content:
          $ref: '#/components/schemas/PlaceOrderContent'

    CancelOrderContent:
      type: object
      required:
        - SecurityID
        - MarketIndicator
        - OrderID
        - ClOrdID
      properties:
        SecurityID:
          type: string
          example: BTCUSDT
        MarketIndicator:
          type: string
          example: '4'
        OrderID:
          type: string
          description: Server order id.
        ClOrdID:
          type: string
          description: Client id for this cancel request.
        Location:
          type: string
          description: Broker target-customer compatibility field.
        UserID:
          type: string
          description: Broker target customer user id.

    CancelOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [OrderSvr]
        method:
          type: string
          enum: [cancelOrder]
        content:
          $ref: '#/components/schemas/CancelOrderContent'

    QueryOpenOrderContent:
      type: object
      properties:
        securityid:
          type: string
          description: Legacy query field currently consumed by runtime.
          example: BTCUSDT
        marketIndicator:
          type: string
          example: '4'
        maxOrderCount:
          type: integer
          minimum: 1
          example: 100
        Location:
          type: string
          description: Broker compatibility field; must match authoritative session location.
        userid:
          type: string
          description: Broker target customer id.
        SecurityID:
          type: string
          description: Canonical alias retained for runtime compatibility.
        MarketIndicator:
          type: string
          description: Canonical alias retained for runtime compatibility.

    QueryOpenOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [OrderSvr]
        method:
          type: string
          enum: [queryOpenOrder]
        content:
          $ref: '#/components/schemas/QueryOpenOrderContent'

    QueryAccountBalanceContent:
      type: object
      properties:
        userid:
          type: string
          description: Broker target customer id. Trader normally sends an empty object.
        location:
          type: string
          description: Broker customer location; must equal Broker authoritative location.

    QueryAccountBalanceEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [TradeSvr]
        method:
          type: string
          enum: [queryAccountBalance]
        content:
          $ref: '#/components/schemas/QueryAccountBalanceContent'

    QueryTradePositionContent:
      type: object
      properties:
        securityid:
          type: string
          example: BTCUSDT
        userid:
          type: string
          description: Broker target customer id.
        location:
          type: string
          description: Broker customer location; must equal Broker authoritative location.

    QueryTradePositionEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [TradeSvr]
        method:
          type: string
          enum: [queryTradePosition]
        content:
          $ref: '#/components/schemas/QueryTradePositionContent'

    BrokerCashContent:
      type: object
      required:
        - Location
        - UserID
        - AccountID
        - Currency
        - Amount
      properties:
        Location:
          type: string
          description: Target customer location; must equal Broker authoritative location.
        UserID:
          type: string
          description: Target customer user id.
        AccountID:
          type: string
          description: Target trading/account id.
        Currency:
          type: string
          example: USDT
        Amount:
          type: string
          description: Decimal amount encoded as string.
          example: '10000'
        Info1:
          type: string
          description: Current runtime external posting reference. External GA will expose a stable externalRef name.
        Demo:
          type: string
          deprecated: true
          description: Internal compatibility field. Official SDK/facade must manage it; external clients must not depend on it.

    CashInEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [TradeSvr]
        method:
          type: string
          enum: [cashIn]
        content:
          $ref: '#/components/schemas/BrokerCashContent'

    CashOutEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [TradeSvr]
        method:
          type: string
          enum: [cashOut]
        content:
          $ref: '#/components/schemas/BrokerCashContent'

    TenantUserAdminContent:
      type: object
      properties:
        cid: { type: string }
        action:
          type: string
          enum: [LIST, CREATE, ENABLE, DISABLE, RESET_PASSWORD]
        request_id: { type: string }
        location:
          type: string
          description: Optional compatibility field; if present must equal authoritative session location.
        user_id: { type: string }
        username: { type: string }
        password:
          type: string
          format: password
        name: { type: string }
        email: { type: string }
        enable: { type: string }
        page_num:
          type: integer
          minimum: 0
          default: 0
        page_size:
          type: integer
          minimum: 1
          default: 50

    TenantUserAdminEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [AdminSvr]
        method:
          type: string
          enum: [tenantUserAdmin]
        content:
          $ref: '#/components/schemas/TenantUserAdminContent'

    TenantSymbolAdminContent:
      type: object
      properties:
        cid: { type: string }
        action:
          type: string
          enum: [LIST, ENABLE, DISABLE]
        location:
          type: string
          description: Optional compatibility field; if present must equal authoritative session location.
        request_id: { type: string }
        security_id: { type: string, example: BTCUSDT }
        market_indicator: { type: string, example: '4' }
        enabled: { type: boolean }
        tick_size: { type: string }
        qty_tick_size: { type: string }
        min_order_qty: { type: string }
        max_order_qty: { type: string }
        min_notional: { type: string }
        market_take_bound: { type: string }
        max_price: { type: string }
        maker_commission: { type: string }
        taker_commission: { type: string }
        funding_interval: { type: integer }
        risk_tiers: { type: string }

    TenantSymbolAdminEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [AdminSvr]
        method:
          type: string
          enum: [tenantSymbolAdmin]
        content:
          $ref: '#/components/schemas/TenantSymbolAdminContent'

    TenantRobotAdminContent:
      type: object
      properties:
        cid: { type: string }
        action:
          type: string
          enum: [LIST, UPSERT, ENABLE, DISABLE]
        location:
          type: string
          description: Optional compatibility field; if present must equal authoritative session location.
        request_id: { type: string }
        robot_id: { type: string }
        robot_name: { type: string }
        security_id: { type: string, example: BTCUSDT }
        api_user_id: { type: string }
        api_key: { type: string }
        quote_source: { type: string }
        enabled: { type: boolean }
        bid_levels: { type: integer }
        ask_levels: { type: integer }
        level_spread_bps: { type: string }
        level_step_bps: { type: string }
        order_qty: { type: string }
        max_position_qty: { type: string }
        refresh_interval_ms: { type: integer }
        stale_price_ms: { type: integer }
        max_deviation_bps: { type: string }
        circuit_breaker_seconds: { type: integer }
        hedge_enabled: { type: boolean }
        hedge_venue: { type: string }
        hedge_account_ref: { type: string }
        hedge_api_key: { type: string }
        hedge_api_secret:
          type: string
          format: password
          writeOnly: true
        strategy_config:
          type: string
          description: Current runtime JSON/string strategy configuration.

    TenantRobotAdminEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [AdminSvr]
        method:
          type: string
          enum: [tenantRobotAdmin]
        content:
          $ref: '#/components/schemas/TenantRobotAdminContent'

    TenantSettingsAdminContent:
      type: object
      properties:
        cid: { type: string }
        action:
          type: string
          enum: [GET, UPDATE, AUDIT]
        location:
          type: string
          description: Optional compatibility field; if present must equal authoritative session location.
        request_id: { type: string }
        registration_enabled: { type: boolean }
        trade_enabled: { type: boolean }
        default_locale: { type: string }
        branding:
          type: string
          description: Current runtime branding JSON/string.
        page_num:
          type: integer
          minimum: 0
        page_size:
          type: integer
          minimum: 1
          default: 50

    TenantSettingsAdminEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [AdminSvr]
        method:
          type: string
          enum: [tenantSettingsAdmin]
        content:
          $ref: '#/components/schemas/TenantSettingsAdminContent'

    TenantTradeAdminContent:
      type: object
      properties:
        cid: { type: string }
        action:
          type: string
          enum: [ORDERS, EXECUTIONS, POSITIONS, BALANCES, POSTINGS, LIQUIDATIONS, ADL_EVENTS, ADL_LEDGER]
        location:
          type: string
          description: Optional compatibility field; if present must equal authoritative session location.
        user_id: { type: string }
        security_id: { type: string }
        page_num:
          type: integer
          minimum: 0
        page_size:
          type: integer
          minimum: 1
          maximum: 200
          default: 50

    TenantTradeAdminEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          enum: [AdminSvr]
        method:
          type: string
          enum: [tenantTradeAdmin]
        content:
          $ref: '#/components/schemas/TenantTradeAdminContent'

    ApiKeyLoginContent:
      type: object
      required: [api_key, location]
      properties:
        api_key:
          type: string
        location:
          type: string
        cid:
          type: string

    ApiKeyLoginEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [LoginSvr] }
        method: { type: string, enum: [apiKeyLogin] }
        content:
          $ref: '#/components/schemas/ApiKeyLoginContent'

    UpdateApiKeyContent:
      type: object
      properties:
        cid: { type: string }
        label: { type: string }
        permissions:
          type: string
          description: Comma-separated subset of allowed Trader scopes.
        ip_whitelist:
          type: string
          description: Current runtime JSON/string IP whitelist representation.
        expires_at:
          type: string
          format: date-time

    UpdateApiKeyEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [LoginSvr] }
        method: { type: string, enum: [updateApiKey] }
        content:
          $ref: '#/components/schemas/UpdateApiKeyContent'

    QueryApiKeyContent:
      type: object
      properties:
        cid: { type: string }

    QueryApiKeyEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [LoginSvr] }
        method: { type: string, enum: [queryApiKey] }
        content:
          $ref: '#/components/schemas/QueryApiKeyContent'

    DeleteApiKeyContent:
      type: object
      required: [api_key]
      properties:
        api_key: { type: string }
        cid: { type: string }

    DeleteApiKeyEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [LoginSvr] }
        method: { type: string, enum: [deleteApiKey] }
        content:
          $ref: '#/components/schemas/DeleteApiKeyContent'

    TenantApiKeyAdminContent:
      type: object
      properties:
        action:
          type: string
          enum: [LIST, CREATE, DELETE]
        label: { type: string }
        permissions:
          type: string
          description: Comma-separated subset of Tenant key scopes.
        api_key: { type: string }
        cid: { type: string }

    TenantApiKeyAdminEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [LoginSvr] }
        method: { type: string, enum: [tenantApiKeyAdmin] }
        content:
          $ref: '#/components/schemas/TenantApiKeyAdminContent'

    QueryPublicMarketContent:
      type: object
      required: [location, securityID]
      properties:
        location:
          type: string
          description: Must remain inside authoritative tenant scope.
        securityID:
          type: string
          example: BTCUSDT

    QueryPublicMarketEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [MDSvr] }
        method: { type: string, enum: [queryPublicMarket] }
        content:
          $ref: '#/components/schemas/QueryPublicMarketContent'

    QueryKLineContent:
      type: object
      required: [location, securityID, text]
      properties:
        location: { type: string }
        securityID: { type: string, example: BTCUSDT }
        start: { type: string }
        end: { type: string }
        text:
          type: string
          description: Kline interval, for example 1m.
          example: 1m
        num:
          type: integer
          minimum: 1
          example: 500

    QueryKLineEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [MDSvr] }
        method: { type: string, enum: [queryKLine] }
        content:
          $ref: '#/components/schemas/QueryKLineContent'

    CancelBatchOrderContent:
      type: object
      required: [SecurityID, MarketIndicator, OrderIDs]
      properties:
        SecurityID: { type: string, example: BTCUSDT }
        MarketIndicator: { type: string, example: '4' }
        OrderIDs:
          type: array
          items: { type: string }
        Location:
          type: string
          description: Broker compatibility field.
        UserID:
          type: string
          description: Broker target customer user id.

    CancelBatchOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [OrderSvr] }
        method: { type: string, enum: [cancelBatchOrder] }
        content:
          $ref: '#/components/schemas/CancelBatchOrderContent'

    QueryOrderContent:
      type: object
      properties:
        securityid: { type: string, example: BTCUSDT }
        marketIndicator: { type: string, example: '4' }
        orderId: { type: string }
        maxOrderCount:
          type: integer
          minimum: 1
          example: 100
        userid:
          type: string
          description: Broker target customer user id.
        location:
          type: string
          description: Broker customer location.

    QueryOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [OrderSvr] }
        method: { type: string, enum: [queryOrder] }
        content:
          $ref: '#/components/schemas/QueryOrderContent'

    QueryExecOrderContent:
      type: object
      properties:
        securityid: { type: string, example: BTCUSDT }
        marketIndicator: { type: string, example: '4' }
        maxOrderCount:
          type: integer
          minimum: 1
          example: 100
        userid:
          type: string
          description: Broker target customer user id.
        location:
          type: string
          description: Broker customer location.

    QueryExecOrderEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [OrderSvr] }
        method: { type: string, enum: [queryExecOrder] }
        content:
          $ref: '#/components/schemas/QueryExecOrderContent'

    EmptyContent:
      type: object
      additionalProperties: false

    GetAccountConfigEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [TradeSvr] }
        method: { type: string, enum: [getAccountConfig] }
        content:
          $ref: '#/components/schemas/EmptyContent'

    SetLeverageContent:
      type: object
      required: [securityID, leverage]
      properties:
        securityID: { type: string, example: BTCUSDT }
        leverage:
          type: integer
          minimum: 1

    SetLeverageEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [TradeSvr] }
        method: { type: string, enum: [setLeverage] }
        content:
          $ref: '#/components/schemas/SetLeverageContent'

    SetPositionTypeContent:
      type: object
      required: [securityID, positionType]
      properties:
        securityID: { type: string, example: BTCUSDT }
        positionType:
          type: string
          example: Cross

    SetPositionTypeEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [TradeSvr] }
        method: { type: string, enum: [setPositionType] }
        content:
          $ref: '#/components/schemas/SetPositionTypeContent'

    ProjectedHistoryContent:
      type: object
      properties:
        location:
          type: string
          description: Compatibility field; session identity remains authoritative for Trader API.
        userId:
          type: string
          description: Broker customer or compatibility field; cannot widen authorized scope.
        securityId: { type: string, example: BTCUSDT }
        limit:
          type: integer
          minimum: 1
          example: 100

    QueryProjectedOrderHistoryEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [ProjectionSvr] }
        method: { type: string, enum: [queryProjectedOrderHistory] }
        content:
          $ref: '#/components/schemas/ProjectedHistoryContent'

    QueryProjectedExecutionHistoryEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName: { type: string, enum: [ProjectionSvr] }
        method: { type: string, enum: [queryProjectedExecutionHistory] }
        content:
          $ref: '#/components/schemas/ProjectedHistoryContent'

    OpenApiSessionIdentity:
      type: object
      required:
        - client_type
        - user_id
