openapi: 3.0.3
info:
  title: DC Crypto Open API v1 - GW Native HTTP Transport
  version: 1.0.0
  description: |
    DC Open API v1 deliberately reuses the existing GW envelope instead of
    introducing Binance-style REST paths or a separate OpenApiSvr. Business
    semantics remain owned by LoginSvr, MDSvr, OrderSvr, TradeSvr,
    ProjectionSvr, AdminSvr and ManagerSvr.
servers:
  - url: /
tags:
  - name: api-key
  - name: session
paths:
  /api:
    post:
      tags: [api-key]
      summary: Signed API-key request
      description: |
        Canonical v1 use is LoginSvr/apiKeyLogin to exchange an API key for a
        tenant-scoped user session. signature = HEX(HMAC-SHA256(secret_key,
        UTF8(raw_http_body + expiry))). expiry is epoch milliseconds.
      security:
        - DcApiKey: []
      parameters:
        - name: cid
          in: header
          required: false
          schema: { type: string }
        - name: expiry
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GwEnvelope'
            examples:
              apiKeyLogin:
                value:
                  serverName: LoginSvr
                  method: apiKeyLogin
                  content:
                    api_key: 0123456789abcdef
                    location: TENANT_A
                    cid: robot-auth-001
      responses:
        '200':
          description: GW business response; inspect code/msg/data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GwResponse'
  /httpapi/:
    post:
      tags: [session]
      summary: Session-authenticated GW request
      description: |
        Used by Trade Web, Tenant Web and Open API clients after login.
        Downstream services bind authoritative location/user identity from the
        LoginSvr session; caller supplied identity cannot widen scope.
      parameters:
        - name: sessionId
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GwEnvelope'
            examples:
              queryOpenOrder:
                value:
                  serverName: OrderSvr
                  method: queryOpenOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
              placeOrder:
                value:
                  serverName: OrderSvr
                  method: placeOrder
                  content:
                    SecurityID: BTCUSDT
                    MarketIndicator: '4'
                    Side: BUY
                    OCType: OPEN
                    OrdType: Limit
                    TimeInForce: GTC
                    OrderQty: '0.010'
                    Price: '60000.0'
                    ClOrdID: tenant-robot-000001
      responses:
        '200':
          description: GW business response; inspect code/msg/data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GwResponse'
components:
  securitySchemes:
    DcApiKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    GwEnvelope:
      type: object
      required: [serverName, method, content]
      properties:
        serverName:
          type: string
          description: Stable DC service contract name.
          enum:
            - LoginSvr
            - MDSvr
            - OrderSvr
            - TradeSvr
            - ProjectionSvr
            - AdminSvr
            - ManagerSvr
        method:
          type: string
          description: Stable v1 method name from the published API catalog.
        content:
          description: Method-specific request object.
          oneOf:
            - type: object
            - type: string
    GwResponse:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          nullable: true
        info1:
          nullable: true
        info2:
          nullable: true
        cid:
          type: string
          nullable: true
x-dc-v1-catalog:
  authentication:
    LoginSvr:
      apiKeyLogin: SIGNED_API_KEY
      updateApiKey: INTERACTIVE_SESSION
      queryApiKey: INTERACTIVE_SESSION
      deleteApiKey: INTERACTIVE_SESSION
      tenantApiKeyAdmin: TENANT_ADMIN
  market:
    MDSvr:
      queryPublicMarket: MARKET_READ
      queryKLine: MARKET_READ
  trading:
    OrderSvr:
      placeOrder: ORDER_WRITE
      cancelOrder: ORDER_WRITE
      cancelBatchOrder: ORDER_WRITE
      queryOrder: ORDER_READ
      queryOpenOrder: ORDER_READ
      queryExecOrder: ORDER_READ
  account:
    TradeSvr:
      setLeverage: ORDER_WRITE
      setPositionType: ORDER_WRITE
  history:
    ProjectionSvr:
      queryProjectedOrderHistory: ORDER_READ
      queryProjectedExecutionHistory: ORDER_READ
  tenant:
    AdminSvr:
      tenantUserAdmin: TENANT_READ_OR_WRITE
      tenantSymbolAdmin: TENANT_READ_OR_WRITE
      tenantRobotAdmin: TENANT_READ_OR_WRITE
      tenantSettingsAdmin: TENANT_READ_OR_WRITE
      tenantTradeAdmin: TENANT_READ
      tenantUserRegistration: PUBLIC_POLICY_GATED
