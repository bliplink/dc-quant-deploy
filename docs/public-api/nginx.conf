map $http_accept_language $docs_entry {
  default /en/;
  ~*^zh /zh/;
}

server {
  listen 18096;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Vary "Accept-Language" always;

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }

  location = / {
    return 302 $docs_entry;
  }

  location = /index.html {
    return 301 /en/;
  }

  location = /openapi/crypto-openapi-v1.yaml {
    return 301 /en/openapi/crypto-openapi-v1.yaml;
  }

  location ^~ /openapi/ {
    return 301 /zh$uri;
  }

  location ^~ /api/ {
    return 301 /zh$uri;
  }

  location = /status/ {
    return 301 /en/status/;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
